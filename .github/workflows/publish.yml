name: Publish

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        type: string
      target:
        description: "Publish target (pypi also publishes to testpypi first)"
        required: true
        type: choice
        options:
          - testpypi
          - pypi

# Each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # a release is built from nothing a PR could have cached
      - name: Build
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          uv version "$VERSION"
          uv build
      # A wheel that does not install, or carries the wrong version, stops here —
      # before anything is published.
      - name: Smoke-test the wheel
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          out="$(uv run --isolated --no-project --with dist/*.whl python -c \
            "import importlib.metadata, invariants; print(importlib.metadata.version('invariants'))")"
          echo "$out"
          test "$out" = "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/invariants
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rerun after PyPI failed must not fail here on the version already uploaded.
          skip-existing: true

  pypi:
    needs: testpypi
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/invariants
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
